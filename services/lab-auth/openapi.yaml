openapi: 3.1.0
info:
  title: Rhine Lab account API
  version: "1.1.0"
  description: >-
    Account contract for every surface of the site. The login flow below is the
    frozen G1 contract with the additive register-v1 extension (service 0.4.0+,
    LOGIN-IMPROVE L1a); the /admin/* operations are the account-management API
    (service 0.5.0+). Implemented by services/lab-auth (Go).

    The canonical prefix is /api/auth because both the static blog pages and the
    /lab/ archive are clients of the same service and share one
    `__Host-lab-session` cookie on this origin; /lab/api/auth is still mounted as
    a deprecated alias for clients older than the current release.

    All responses are Cache-Control: no-store. Errors never echo passwords or
    distinguish "unknown user" from "wrong password". Registration is not login:
    POST /register creates a persistent account and never sets or changes a
    session cookie. The admin API is cookie-less (bearer token only) and answers
    503 while no LAB_AUTH_ADMIN_TOKEN is configured.
x-lab-features: ["register-v1", "admin-v1"]
servers:
  - url: /api/auth
  - url: /lab/api/auth
    description: Deprecated alias kept for clients older than the current release.
paths:
  /csrf:
    get:
      summary: Start a pre-authentication flow
      operationId: getCsrf
      responses:
        "200":
          description: Flow and its CSRF token. Sets the flow cookie.
          headers:
            Set-Cookie:
              schema:
                {
                  type: string,
                  example: "__Host-lab-flow=...; Secure; HttpOnly; SameSite=Lax; Path=/",
                }
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /login:
    post:
      summary: Verify credentials and open a short-lived pending attempt
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credentials valid; a pending session cookie is set. Session API still reports unauthenticated.
          headers:
            Set-Cookie:
              schema:
                {
                  type: string,
                  example: "__Host-lab-session=...; Secure; HttpOnly; SameSite=Lax; Path=/",
                }
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /register:
    post:
      summary: Create a public account without signing in
      description: >-
        Additive register-v1 extension. Requires a pre-auth flow and its CSRF
        token. Creates one enabled user and returns 201; it never sets a
        session cookie, never authenticates the caller and never changes an
        existing session. The client must call /login and /confirm afterwards.
        Disabled by default; see registration_enabled.
      operationId: register
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; no session cookie is set.
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/RegistrationUnavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RegistrationDisabled" }
  /confirm:
    post:
      summary: Promote a pending attempt to an active session
      operationId: confirm
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmRequest" }
      responses:
        "200":
          description: Active session. Never sets a cookie; reuses the pending session cookie.
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /session:
    get:
      summary: Report the current session state without writing cookies
      operationId: getSession
      responses:
        "200":
          description: Authenticated or unauthenticated state.
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /cancel:
    post:
      summary: Cancel a pending attempt or the session it issued
      operationId: cancel
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "204":
          { description: Cancelled or already cancelled (idempotent). No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /logout:
    post:
      summary: Revoke the current session and expire its cookie
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          {
            description: Logged out or already anonymous (idempotent). No body.,
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  # --- account management (admin-v1) -----------------------------------------
  # Bearer-token only; session cookies are ignored, so a browser session cannot
  # manage accounts and no CSRF token applies. Every mutation appends one audit
  # row with actor "admin-api". Answers 503 admin_disabled while no
  # LAB_AUTH_ADMIN_TOKEN is configured.
  /admin/status:
    get:
      summary: Service and database status
      operationId: adminStatus
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: Status document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/users:
    get:
      summary: List accounts
      operationId: adminListUsers
      security: [{ adminToken: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Case-insensitive username substring. }
        - { name: enabled, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: One page of accounts, newest ordering by username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
    post:
      summary: Create an account
      operationId: adminCreateUser
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, description: Never logged or echoed. }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/users/{ref}:
    parameters:
      - $ref: "#/components/parameters/AccountRef"
    get:
      summary: Show one account
      operationId: adminGetUser
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
    delete:
      summary: Delete an account and its sessions
      operationId: adminDeleteUser
      security: [{ adminToken: [] }]
      parameters:
        - { name: force, in: query, schema: { type: boolean }, description: Required to delete the last enabled account. }
      responses:
        "200":
          description: The deleted account. The audit row keeps its username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/users/{ref}/enable:
    post:
      summary: Enable an account
      operationId: adminEnableUser
      security: [{ adminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountRef"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/users/{ref}/disable:
    post:
      summary: Disable an account and revoke its sessions
      operationId: adminDisableUser
      security: [{ adminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountRef"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/users/{ref}/password:
    post:
      summary: Reset a password and revoke that account's sessions
      operationId: adminResetPassword
      security: [{ adminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: Never logged or echoed. }
      responses:
        "200":
          description: The updated account; the credential version is bumped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/users/{ref}/sessions/revoke:
    post:
      summary: Revoke every session of one account
      operationId: adminRevokeSessions
      security: [{ adminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountRef"
      responses:
        "200":
          description: The account and how many sessions were revoked.
          content:
            application/json:
              schema:
                type: object
                required: [user, revoked]
                properties:
                  user: { $ref: "#/components/schemas/AdminUser" }
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/sessions:
    get:
      summary: List sessions across accounts
      operationId: adminListSessions
      security: [{ adminToken: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string }, description: Username or user id. }
        - { name: state, in: query, schema: { type: string, enum: [pending, active, revoked] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Session rows with their account username.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
  /admin/audit:
    get:
      summary: Read the account-management audit trail (newest first)
      operationId: adminListAudit
      security: [{ adminToken: [] }]
      parameters:
        - { name: target, in: query, schema: { type: string }, description: Username key. }
        - { name: action, in: query, schema: { type: string }, description: "user.create | user.enable | user.disable | user.password | user.delete | session.revoke" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Audit rows.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AdminDisabled" }
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: LAB_AUTH_ADMIN_TOKEN. Never sent by a browser client.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    AccountRef:
      name: ref
      in: path
      required: true
      schema: { type: string }
      description: Username (any case) or user id.
  schemas:
    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string, description: Stable random user id }
        username:
          {
            type: string,
            description: Canonical stored username (display case),
          }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - invalid_credentials
                - origin_rejected
                - csrf_rejected
                - state_conflict
                - payload_too_large
                - rate_limited
                - registration_unavailable
                - registration_disabled
                - unavailable
            message: { type: string }
        requestId: { type: string }
    CsrfResponse:
      type: object
      required: [flowId, attemptId, csrfToken, expiresAt]
      properties:
        flowId: { type: string }
        attemptId: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [attemptId, username, password]
      properties:
        attemptId: { type: string }
        username: { type: string, minLength: 3, maxLength: 24 }
        password:
          { type: string, description: 6-128 Unicode code points, with at least one ASCII uppercase letter, one lowercase letter and one digit; sent as-is }
    LoginResponse:
      type: object
      required: [pending, user, attemptId]
      properties:
        pending: { type: boolean, const: true }
        user: { $ref: "#/components/schemas/User" }
        attemptId: { type: string }
    ConfirmRequest:
      type: object
      required: [attemptId]
      properties:
        attemptId: { type: string }
    ConfirmResponse:
      type: object
      required: [authenticated, user, sessionExpiresAt, csrfToken]
      properties:
        authenticated: { type: boolean, const: true }
        user: { $ref: "#/components/schemas/User" }
        sessionExpiresAt: { type: string, format: date-time }
        csrfToken: { type: string, description: Session-bound token for logout }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 24 }
        password:
          { type: string, description: 6-128 Unicode code points, with at least one ASCII uppercase letter, one lowercase letter and one digit; sent as-is }
    RegisterResponse:
      type: object
      required: [registered, user]
      properties:
        registered: { type: boolean, const: true }
        user: { $ref: "#/components/schemas/User" }
    # --- admin-v1 models ---------------------------------------------------
    AdminUser:
      type: object
      required: [id, username, enabled, credentialVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        enabled: { type: boolean }
        credentialVersion: { type: integer }
        createdAt: { type: integer, description: Unix seconds }
        updatedAt: { type: integer, description: Unix seconds }
    AdminUserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
    AdminUserPage:
      type: object
      required: [users, total, limit, offset]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total: { type: integer, description: Unpaginated total for the same filter }
        limit: { type: integer }
        offset: { type: integer }
    AdminSession:
      type: object
      required: [id, userId, username, state, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt]
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        state: { type: string, enum: [pending, active, revoked] }
        createdAt: { type: integer }
        lastSeenAt: { type: integer }
        idleExpiresAt: { type: integer }
        absoluteExpiresAt: { type: integer }
    AdminAuditEntry:
      type: object
      required: [id, at, actor, action, target, detail]
      properties:
        id: { type: string }
        at: { type: integer, description: Unix seconds }
        actor: { type: string, description: "admin-api, cli:<os user> or system" }
        action: { type: string }
        target: { type: string, description: Username key; survives account deletion }
        detail: { type: string }
    AdminStatus:
      type: object
      required: [service, database]
      properties:
        service:
          type: object
          required: [version, env, adminEnabled, registration, now]
          properties:
            version: { type: string }
            env: { type: string, enum: [development, production] }
            adminEnabled: { type: boolean, const: true }
            registration: { type: boolean }
            now: { type: integer }
        database:
          type: object
          required: [path, schemaVersion, migratedAt, users, enabled, disabled, sessions, auditEntries]
          properties:
            path: { type: string }
            schemaVersion: { type: integer }
            migratedAt: { type: integer }
            users: { type: integer }
            enabled: { type: integer }
            disabled: { type: integer }
            sessions:
              type: object
              properties:
                active: { type: integer }
                pending: { type: integer }
            auditEntries: { type: integer }
    SessionResponse:
      oneOf:
        - type: object
          required: [authenticated]
          properties:
            authenticated: { type: boolean, const: false }
        - type: object
          required: [authenticated, user, sessionExpiresAt, csrfToken]
          properties:
            authenticated: { type: boolean, const: true }
            user: { $ref: "#/components/schemas/User" }
            sessionExpiresAt: { type: string, format: date-time }
            csrfToken: { type: string }
    CancelRequest:
      type: object
      required: [attemptId]
      properties:
        attemptId: { type: string }
  responses:
    BadRequest:
      description: Malformed body, unknown field, wrong content type, or body over 4 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >-
        Login: credentials rejected; never reveals whether the username exists.
        Admin: missing or wrong bearer token; never says which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >-
        Login: attempt already cancelled/confirmed/expired. Admin: username
        taken, or the last enabled account deleted without force.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RegistrationUnavailable:
      description: >-
        Username cannot be registered (reserved, disabled or already taken).
        Never reveals which case applies and never returns existing account
        details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RegistrationDisabled:
      description: >-
        Public registration is disabled or over its quota. Codes:
        registration_disabled, rate_limited or unavailable. Existing login and
        guest entry are unaffected.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such account. Code not_found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminDisabled:
      description: >-
        No LAB_AUTH_ADMIN_TOKEN is configured. The management surface is off,
        not missing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body exceeds 4 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Source, username or admin bucket exhausted.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Verification queue full or storage unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
