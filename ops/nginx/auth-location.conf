# Parameterized Nginx proxy for the account API. Include inside the production or
# candidate server block. The socket path and allowed origins are fixed by
# ops/auth/auth.env; this fragment only forwards the exact prefixes.
#
# Client address: the service identifies a caller for rate limiting by
# X-Real-IP ($remote_addr), and only trusts that header when the immediate peer
# is this proxy — which is exactly the unix-socket connection below. Both
# headers are overwritten rather than appended, so a client cannot inject its own
# address into either one.
#
# `/api/auth/` is the canonical, surface-neutral prefix: the static blog pages and
# the /lab/ archive are both clients of the same account service and share one
# `__Host-lab-session` cookie on this origin. `/lab/api/auth/` stays as an alias so
# a cached bundle, an already-open tab or an older nginx fragment keeps working
# across a release; drop it once no client older than the current release matters.

# Account management never answers on the public site. The service keeps its own
# bearer-token gate, but the management surface should not be reachable from the
# internet at all — the two prefixes below would otherwise expose it. To operate
# the API remotely, replace this block with an allow list of your own networks
# (and keep it narrower than the location below), or reach the service over an
# internal listener / ssh tunnel instead of publishing it.
location ^~ /api/auth/admin/ { return 404; }
location ^~ /lab/api/auth/admin/ { return 404; }

location /api/auth/ {
    proxy_pass http://unix:/run/example-blog-auth/http.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for would keep a client-supplied left-most entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    client_max_body_size 4k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# Deprecated alias for the prefix used before the account API became shared.
location /lab/api/auth/ {
    proxy_pass http://unix:/run/example-blog-auth/http.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for would keep a client-supplied left-most entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    client_max_body_size 4k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# Canonical paths without the trailing slash are not resources.
location = /api/auth { return 404; }
location = /lab/api/auth { return 404; }
