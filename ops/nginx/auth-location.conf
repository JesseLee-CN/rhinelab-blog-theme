# Parameterized Nginx proxy for the boot identity API. Include inside the
# production/candidate server block. The socket path and origin are fixed by
# ops/auth/auth.env; this fragment only forwards the exact prefix.
location /lab/api/auth/ {
    proxy_pass http://unix:/run/example-blog-auth/http.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    client_max_body_size 4k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# Canonical path without the trailing slash is not a resource.
location = /lab/api/auth { return 404; }
