# 生产静态博客虚拟主机（替换原 WordPress 入口，仅作用于 example.com）。
# 安装位置：/etc/nginx/sites-available/wordpress（先备份原文件）。
# 依赖：/srv/example-blog/active -> releases/<id>，且 active/nginx/*.map 存在。
# 证书、ACME 与 www 策略沿用 S0 盘点结果。

map "$uri|$arg_p" $blog_id_redirect {
    default "";
    include /srv/example-blog/active/nginx/id.map;
}
map "$uri|$arg_page_id" $blog_page_id_redirect {
    default "";
    include /srv/example-blog/active/nginx/page-id.map;
}
map $uri $blog_path_redirect {
    default "";
    include /srv/example-blog/active/nginx/path.map;
}
map "$uri|$arg_p" $blog_id_404 {
    default "";
    include /srv/example-blog/active/nginx/id-404.map;
}
map "$uri|$arg_page_id" $blog_page_id_404 {
    default "";
    include /srv/example-blog/active/nginx/page-id-404.map;
}

# HTTP — ACME + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://example.com$request_uri;
    }
}

# HTTPS — www 跳转规范域名
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    return 301 https://example.com$request_uri;
}

# HTTPS — 静态博客主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /srv/example-blog/active/site;
    index index.html;

    add_header X-Blog-Release "active" always;

    # 旧查询入口精确 301；草稿/已删除查询入口真实 404；命中后不再二次重定向。
    if ($blog_id_404 != "") { return 404; }
    if ($blog_page_id_404 != "") { return 404; }
    if ($blog_id_redirect != "") { return 301 $blog_id_redirect; }
    if ($blog_page_id_redirect != "") { return 301 $blog_page_id_redirect; }
    if ($blog_path_redirect != "") { return 301 $blog_path_redirect$is_args$args; }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Blog-Release "active" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
    error_page 404 /404.html;

    # 迁移完成后不存在 WordPress 执行入口。
    location ~ \.php(?:/|$) { return 404; }
    location = /xmlrpc.php { return 410; }
    location ^~ /wp-admin/ { return 410; }
    location = /wp-login.php { return 410; }

    location ~ /\. { deny all; }
}
