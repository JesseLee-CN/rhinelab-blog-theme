# 候选站配置：仅绑定 127.0.0.1:8088，不占用生产 80/443，不影响现有 WordPress。
# 安装位置：/etc/nginx/conf.d/example-blog-candidate.conf
# 使用 cand_* 变量名，避免与生产配置的 blog_* map 变量冲突。
#
# 重要：root 与所有 map include 必须指向**候选自己的部署根**。2026-09-12 的 IR8
# 发现仓库模板里写的是 /srv/example-blog/active（生产根），而服务器上实际安装的
# 配置指向候选根；一旦有人重跑 ops/install-candidate.sh，模板就会把“候选站”重新
# 指到生产内容上，候选验收随之失去意义。此文件现已与已安装配置对齐。
map "$uri|$arg_p" $cand_id_redirect {
    default "";
    include /srv/example-blog-candidate/active/nginx/id.map;
}
map "$uri|$arg_page_id" $cand_page_id_redirect {
    default "";
    include /srv/example-blog-candidate/active/nginx/page-id.map;
}
map $uri $cand_path_redirect {
    default "";
    include /srv/example-blog-candidate/active/nginx/path.map;
}
map "$uri|$arg_p" $cand_id_404 {
    default "";
    include /srv/example-blog-candidate/active/nginx/id-404.map;
}
map "$uri|$arg_page_id" $cand_page_id_404 {
    default "";
    include /srv/example-blog-candidate/active/nginx/page-id-404.map;
}

server {
    listen 127.0.0.1:8088;
    listen [::1]:8088;
    server_name _;

    root /srv/example-blog-candidate/active/site;
    index index.html;

    add_header X-Blog-Release "candidate" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($cand_id_404 != "") { return 404; }
    if ($cand_page_id_404 != "") { return 404; }
    if ($cand_id_redirect != "") { return 301 $cand_id_redirect; }
    if ($cand_page_id_redirect != "") { return 301 $cand_page_id_redirect; }
    if ($cand_path_redirect != "") { return 301 $cand_path_redirect$is_args$args; }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
